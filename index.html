<div id="silapAppContainer">
  <div class="container-fluid px-4">

    <!-- Header Navigation Bar -->
    <div class="d-flex justify-content-between align-items-center mb-4 pb-2 border-bottom no-print">
      <div class="d-flex align-items-center gap-2">
        <i class="bi bi-truck fs-3 text-primary"></i>
        <div>
          <h4 class="fw-bold mb-0">SILAP-KDF BMN TD <small class="fs-6 text-muted fw-normal">| Monitoring Aset</small></h4>
          <span id="syncStatusBadge" class="badge bg-secondary">Memeriksa Cache...</span>
        </div>
      </div>
      <button class="btn btn-primary btn-sm" onclick="fetchDatabaseData(true)">
        <i class="bi bi-arrow-clockwise me-1" id="refreshIcon"></i> Refresh Data
      </button>
    </div>

    <!-- Loading Spinner & Diagnostics Box -->
    <div id="loadingSpinner" class="text-center py-5">
      <div class="spinner-border text-primary" style="width: 3rem; height: 3rem;" role="status"></div>
      <p id="loadingText" class="mt-3 text-muted fw-semibold">Memuat Data dari Web API Apps Script...</p>

      <div id="errorRetryBox" style="display: none;" class="mt-4 mx-auto text-start" style="max-width: 650px;">
        <div class="alert alert-danger shadow-sm border-0 p-4">
          <h5 class="fw-bold text-danger mb-2"><i class="bi bi-exclamation-octagon-fill me-2"></i>Koneksi Backend Gagal</h5>
          <hr>
          <div id="errorMessage" class="mb-3 small"></div>
          <div class="d-flex gap-2 flex-wrap">
            <button class="btn btn-primary btn-sm" onclick="fetchDatabaseData(true)">
              <i class="bi bi-arrow-repeat me-1"></i> Coba Lagi
            </button>
            <button class="btn btn-outline-secondary btn-sm" onclick="testDirectConnection()">
              <i class="bi bi-box-arrow-up-right me-1"></i> Tes URL Backend Langsung
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Main Content Area -->

      <!-- Nav Tabs -->
      <ul class="nav nav-pills mb-4 no-print" id="pills-tab" role="tablist">
        <li class="nav-item" role="presentation">
          <button class="nav-link active" id="tab-rekap-tab" data-bs-toggle="pill" data-bs-target="#tab-rekap" type="button" role="tab">

        <!-- TAB 1: REKAP KESELURUHAN -->
        <div class="tab-pane fade show active" id="tab-rekap" role="tabpanel">

            <div class="row g-2">
              <div class="col-md-6">
                <div class="input-group">
                  <span class="input-group-text bg-white"><i class="bi bi-search"></i></span>

                <select id="filterKondisi" class="form-select" onchange="filterRekapTable()">

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script>
  // PASTE GOOGLE APPS SCRIPT WEB APP URL DI BAWAH INI:
  const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzd3lcW5b9H1V1qkAwO6SY8CSpHPUalHkc3OAqQrjp76pZqMnfR3LaQ7zkUsxA0FkYP/exec";
  const CACHE_KEY = "SILAP_FRONTEND_CACHE_DATA";

  let globalData = [];

  document.addEventListener("DOMContentLoaded", function() {
    const appEl = document.getElementById('silapAppContainer');
    if (appEl && appEl.parentElement !== document.body) {
      document.body.appendChild(appEl);
    }
    
    document.body.style.margin = '0';
    document.body.style.padding = '0';

    const cachedData = localStorage.getItem(CACHE_KEY);
    if (cachedData) {
      try {
        const parsed = JSON.parse(cachedData);
        if (parsed && parsed.length > 0) {
          globalData = parsed;
          renderRekapTable(globalData);
          renderBarangSelector(globalData);
          
          document.getElementById('loadingSpinner').style.display = 'none';
          document.getElementById('mainContent').style.display = 'block';
          updateSyncBadge('bg-info text-dark', '<i class="bi bi-check-circle me-1"></i> Menggunakan Cache');
        }
      } catch (e) {
        console.warn("Gagal membaca cache lokal", e);
      }
    }

    fetchDatabaseData(false);
  });

  async function fetchDatabaseData(forceRefresh = false) {
    const loadingSpinner = document.getElementById('loadingSpinner');
    const mainContent = document.getElementById('mainContent');
    const errorRetryBox = document.getElementById('errorRetryBox');
    const refreshIcon = document.getElementById('refreshIcon');

    const isPlaceholder = !GAS_WEB_APP_URL || GAS_WEB_APP_URL.includes("AKfycbx...");
    const isEditUrl = GAS_WEB_APP_URL.includes("/edit");

    if (isPlaceholder || isEditUrl) {
      loadingSpinner.style.display = 'block';
      mainContent.style.display = 'none';
      errorRetryBox.style.display = 'block';
      
      let msg = isEditUrl 
        ? `<strong>URL Backend Salah Format!</strong> Wajib berakhiran <code>/exec</code>.`
        : `<strong>URL Web App Belum Diganti!</strong> Silakan ganti variabel <code>GAS_WEB_APP_URL</code>.`;
      
      document.getElementById('errorMessage').innerHTML = msg;
      updateSyncBadge('bg-danger', '<i class="bi bi-x-circle me-1"></i> URL Belum Diset');
      return;
    }

    if (refreshIcon) refreshIcon.classList.add('spin-anim');
    updateSyncBadge('bg-warning text-dark', '<i class="bi bi-arrow-repeat me-1"></i> Memperbarui Data...');

    if (globalData.length === 0) {
      loadingSpinner.style.display = 'block';
      mainContent.style.display = 'none';
      errorRetryBox.style.display = 'none';
    }

    const controller = new AbortController();
    const timeoutId = setTimeout(() => controller.abort(), 25000);

    try {
      // Penambahan timestamp (_t) untuk membypass HTTP browser caching secara penuh
      const timestamp = new Date().getTime();
      const url = forceRefresh 
        ? `${GAS_WEB_APP_URL}?action=getDatabaseData&nocache=1&_t=${timestamp}` 
        : `${GAS_WEB_APP_URL}?action=getDatabaseData&_t=${timestamp}`;
      
      const response = await fetch(url, { 
        signal: controller.signal,
        cache: 'no-store'
      });
      clearTimeout(timeoutId);

      if (!response.ok) throw new Error(`HTTP Error! Status: ${response.status}`);

      const res = await response.json();
      if (!res.success) throw new Error(res.error || 'Terjadi kesalahan backend.');

      globalData = res.items || [];
      localStorage.setItem(CACHE_KEY, JSON.stringify(globalData));

      renderRekapTable(globalData);
      renderBarangSelector(globalData);

      loadingSpinner.style.display = 'none';
      mainContent.style.display = 'block';
      updateSyncBadge('bg-success', '<i class="bi bi-cloud-check me-1"></i> Data Terkini');

    } catch (err) {
      console.error("Fetch Error:", err);
      if (globalData.length > 0) {
        updateSyncBadge('bg-secondary', '<i class="bi bi-wifi-off me-1"></i> Mode Offline');
      } else {
        loadingSpinner.style.display = 'block';
        mainContent.style.display = 'none';
        errorRetryBox.style.display = 'block';
        document.getElementById('errorMessage').innerHTML = `<code>${err.message || err}</code>`;
        updateSyncBadge('bg-danger', '<i class="bi bi-x-circle me-1"></i> Gagal Sinkron');
      }
    } finally {
      if (refreshIcon) refreshIcon.classList.remove('spin-anim');
    }
  }

  function testDirectConnection() {
    if (GAS_WEB_APP_URL && !GAS_WEB_APP_URL.includes("AKfycbx...")) {
      window.open(`${GAS_WEB_APP_URL}?action=getDatabaseData&nocache=1`, '_blank');
    }
  }

  function updateSyncBadge(bgClass, htmlContent) {
    const badge = document.getElementById('syncStatusBadge');
    if (badge) {
      badge.className = `badge ${bgClass}`;
      badge.innerHTML = htmlContent;
    }
  }

  function renderRekapTable(items) {
    const tbody = document.getElementById('rekapTableBody');
    tbody.innerHTML = '';

    if (!items || items.length === 0) {
      tbody.innerHTML = '<tr><td colspan="9" class="text-center py-4 text-muted">Tidak ada data ditemukan.</td></tr>';
      return;
    }

    items.forEach((item, index) => {
      const fotoHtml = item.foto 
        ? `<img src="${item.foto}" class="img-thumb" alt="Foto">`
        : `<span class="badge bg-secondary">No Image</span>`;

      let badgeKondisi = 'bg-success';
      const kondisiLower = (item.kondisi || '').toLowerCase();
      if (kondisiLower.includes('rr') || kondisiLower.includes('rusak ringan')) badgeKondisi = 'bg-warning text-dark';
      if (kondisiLower.includes('rb') || kondisiLower.includes('rusak berat')) badgeKondisi = 'bg-danger';

      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td class="text-center fw-bold">${index + 1}</td>
        <td class="text-center">${fotoHtml}</td>
        <td>
          <div class="fw-bold text-primary">${item.namaBarang}</div>
          <small class="text-muted">Kode: ${item.kodeBarang}</small>
        </td>
        <td>
          <div class="fw-semibold">${item.nopol}</div>
          <small class="text-muted">NUP: ${item.nup}</small>
        </td>
        <td>${item.merk} / ${item.tipe} (${item.tahun})</td>
        <td><span class="badge badge-kondisi ${badgeKondisi}">${item.kondisi}</span></td>
        <td>${item.nilaiPerolehanFormatted}</td>
        <td class="text-center"><span class="badge bg-info text-dark fw-bold">${(item.history || []).length} Trx</span></td>
        <td class="text-center no-print">
          <button class="btn btn-sm btn-outline-primary" onclick="viewDetail('${item.id}')">
            <i class="bi bi-eye"></i> Detail
          </button>
        </td>
      `;
      tbody.appendChild(tr);
    });
  }

  function renderBarangSelector(items) {
    const select = document.getElementById('selectBarang');
    const prevValue = select.value;
    select.innerHTML = '';

    items.forEach(item => {
      const opt = document.createElement('option');
      opt.value = item.id;
      opt.textContent = `${item.namaBarang} - ${item.nopol} (NUP: ${item.nup})`;
      select.appendChild(opt);
    });

    if (items.length > 0) {
      const activeId = items.some(i => i.id === prevValue) ? prevValue : items[0].id;
      select.value = activeId;
      renderDetailBarang(activeId);
    }
  }

  function filterRekapTable() {
    const searchVal = document.getElementById('searchInput').value.toLowerCase();
    const kondisiVal = document.getElementById('filterKondisi').value.toLowerCase();

    const filtered = globalData.filter(item => {
      const matchesSearch = (item.namaBarang || '').toLowerCase().includes(searchVal) ||
                            (item.nopol || '').toLowerCase().includes(searchVal) ||
                            (item.nup || '').toLowerCase().includes(searchVal) ||
                            (item.merk || '').toLowerCase().includes(searchVal);

      const matchesKondisi = kondisiVal === '' || (item.kondisi || '').toLowerCase().includes(kondisiVal);

      return matchesSearch && matchesKondisi;
    });

    renderRekapTable(filtered);
  }

  function viewDetail(itemId) {
    document.getElementById('selectBarang').value = itemId;
    renderDetailBarang(itemId);

    const detailTab = new bootstrap.Tab(document.getElementById('tab-detail-tab'));
    detailTab.show();
  }

  function renderDetailBarang(itemId) {
    const item = globalData.find(i => i.id === itemId);
    const container = document.getElementById('detailContainer');

    if (!item) {
      container.innerHTML = '<div class="alert alert-warning">Data barang tidak ditemukan.</div>';
      return;
    }

    let historyRows = '';
    if (!item.history || item.history.length === 0) {
      historyRows = '<tr><td colspan="13" class="text-center py-4 text-muted">Belum ada riwayat peminjaman / pengembalian.</td></tr>';
    } else {
      item.history.forEach(h => {
        const imgKeluar = h.keluarFoto ? `<a href="${h.keluarFoto}" target="_blank"><img src="${h.keluarFoto}" class="img-thumb"></a>` : '-';
        const imgMasuk = h.masukFoto ? `<a href="${h.masukFoto}" target="_blank"><img src="${h.masukFoto}" class="img-thumb"></a>` : '-';

        historyRows += `
          <tr>
            <td class="text-center fw-bold">${h.trxNo}</td>
            <td class="fw-semibold">${h.keluarTgl}</td>
            <td>${h.keluarPetugasSerah}</td>
            <td>${h.keluarPetugasTerima}</td>
            <td>${h.keluarBA}</td>
            <td class="text-center">${imgKeluar}</td>
            <td>${h.keluarLokasi}</td>
            <td class="fw-semibold">${h.masukTgl}</td>
            <td>${h.masukPetugasTerima}</td>
            <td>${h.masukPetugasSerah}</td>
            <td>${h.masukBA}</td>
            <td class="text-center">${imgMasuk}</td>
            <td>${h.masukLokasi}</td>
          </tr>
        `;
      });
    }

    container.innerHTML = `
      <div class="detail-card">
        <div class="d-flex justify-content-between align-items-center mb-3">
          <h4 class="fw-bold text-primary mb-0"><i class="bi bi-truck me-2"></i> Laporan Peminjaman Kendaraan Dinas Fungsional - TANGGAP DARURAT</h4>
          <button class="btn btn-outline-dark btn-sm no-print" onclick="window.print()">
            <i class="bi bi-printer me-1"></i> Cetak Kartu Kendaraan
          </button>
        </div>

        <div class="row g-4 mb-4">
          <div class="col-md-4 text-center">
            ${item.foto 
              ? `<img src="${item.foto}" class="img-preview-lg mb-2" alt="Foto Unit">` 
              : `<div class="p-5 bg-light rounded text-muted"><i class="bi bi-image fs-1"></i><br>Foto Tidak Tersedia</div>`}
            <div class="mt-2 fw-bold text-dark fs-5">${item.nopol}</div>
          </div>
          <div class="col-md-8">
            <table class="table table-sm table-borderless fs-6">
              <tbody>
                <tr><td width="30%" class="text-muted">Nama Barang</td><td width="5%">:</td><td class="fw-bold text-dark">${item.namaBarang}</td></tr>
                <tr><td class="text-muted">Kode Satker</td><td>:</td><td>${item.kodeSatker}</td></tr>
                <tr><td class="text-muted">Kode Barang / NUP</td><td>:</td><td>${item.kodeBarang} / <span class="badge bg-dark">${item.nup}</span></td></tr>
                <tr><td class="text-muted">Merk / Tipe</td><td>:</td><td>${item.merk} / ${item.tipe}</td></tr>
                <tr><td class="text-muted">Tahun / Jenis BMN</td><td>:</td><td>${item.tahun} / ${item.jenisBmn}</td></tr>
                <tr><td class="text-muted">Kondisi Barang</td><td>:</td><td><span class="badge bg-info text-dark">${item.kondisi}</span></td></tr>
                <tr><td class="text-muted">Nilai Perolehan</td><td>:</td><td class="fw-bold text-success fs-5">${item.nilaiPerolehanFormatted}</td></tr>
              </tbody>
            </table>
          </div>
        </div>

        <h5 class="fw-bold text-dark mt-4 mb-3"><i class="bi bi-clock-history me-2"></i> Riwayat Barang Keluar & Barang Masuk</h5>

        <div class="table-responsive">
          <table class="table align-middle text-sm" style="font-size: 0.85rem;">
            <thead>
              <tr>
                <th rowspan="2" class="text-center bg-dark text-white align-middle">No</th>
                <th colspan="6" class="text-center trx-keluar-header">KDF BARANG KELUAR (PEMINJAMAN)</th>
                <th colspan="6" class="text-center trx-masuk-header">KDF BARANG MASUK (PENGEMBALIAN)</th>
              </tr>
              <tr style="font-size: 0.78rem;">
                <th class="trx-keluar-header">Tanggal</th>
                <th class="trx-keluar-header">Petugas Serah</th>
                <th class="trx-keluar-header">Penerima</th>
                <th class="trx-keluar-header">No. BA / Jenis</th>
                <th class="trx-keluar-header text-center">Foto Kegiatan</th>
                <th class="trx-keluar-header">Lokasi Pinjam</th>
                <th class="trx-masuk-header">Tanggal</th>
                <th class="trx-masuk-header">Petugas Terima</th>
                <th class="trx-masuk-header">Petugas Serah</th>
                <th class="trx-masuk-header">No. BA / Jenis</th>
                <th class="trx-masuk-header text-center">Foto Kegiatan</th>
                <th class="trx-masuk-header">Lokasi Kembali</th>
              </tr>
            </thead>
            <tbody>
              ${historyRows}
            </tbody>
          </table>
        </div>

      </div>
    `;
  }
</script>
